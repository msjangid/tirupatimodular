<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirupati Admin Panel - Chat Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .data-table {
            max-height: 500px;
            overflow-y: auto;
        }
        .session-details {
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 p-6">
    <div class="max-w-7xl mx-auto">
        <div class="glass-effect rounded-lg p-6 mb-6">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-white flex items-center">
                    <svg class="w-8 h-8 mr-3" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Tirupati Admin Panel
                </h1>
                <div class="flex space-x-4">
                    <button id="refreshBtn" class="bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-lg transition duration-300">
                        <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Refresh
                    </button>
                    <button id="exportBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition duration-300">
                        <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Export CSV
                    </button>
                    <button id="clearBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition duration-300">
                        <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        Clear Data
                    </button>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white bg-opacity-20 rounded-lg p-4 text-white">
                    <div class="text-2xl font-bold" id="totalSessions">0</div>
                    <div class="text-sm opacity-75">Total Sessions</div>
                </div>
                <div class="bg-white bg-opacity-20 rounded-lg p-4 text-white">
                    <div class="text-2xl font-bold" id="uniqueVisitors">0</div>
                    <div class="text-sm opacity-75">Unique Visitors</div>
                </div>
                <div class="bg-white bg-opacity-20 rounded-lg p-4 text-white">
                    <div class="text-2xl font-bold" id="totalMessages">0</div>
                    <div class="text-sm opacity-75">Total Messages</div>
                </div>
                <div class="bg-white bg-opacity-20 rounded-lg p-4 text-white">
                    <div class="text-2xl font-bold" id="avgSessionTime">0m</div>
                    <div class="text-sm opacity-75">Avg Session Time</div>
                </div>
            </div>

            <!-- Filter Controls -->
            <div class="flex flex-wrap gap-4 mb-6">
                <input type="date" id="dateFrom" class="bg-white bg-opacity-20 text-white placeholder-gray-300 px-3 py-2 rounded-lg border border-white border-opacity-30">
                <input type="date" id="dateTo" class="bg-white bg-opacity-20 text-white placeholder-gray-300 px-3 py-2 rounded-lg border border-white border-opacity-30">
                <input type="text" id="searchEmail" placeholder="Search by email..." class="bg-white bg-opacity-20 text-white placeholder-gray-300 px-3 py-2 rounded-lg border border-white border-opacity-30">
                <button id="filterBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition duration-300">Apply Filter</button>
            </div>
        </div>

        <!-- Sessions Table -->
        <div class="glass-effect rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold text-white mb-4">Chat Sessions</h2>
            <div class="data-table bg-white rounded-lg overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Session ID</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Start Time</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Duration</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Messages</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sessionsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Sessions will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Session Details Modal -->
        <div id="sessionModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg max-w-4xl w-full max-h-screen overflow-hidden">
                <div class="flex items-center justify-between p-6 border-b">
                    <h3 class="text-lg font-semibold" id="modalTitle">Session Details</h3>
                    <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <h4 class="font-semibold mb-2">Session Information</h4>
                            <div id="sessionInfo" class="text-sm space-y-2">
                                <!-- Session info will be populated here -->
                            </div>
                        </div>
                        <div>
                            <h4 class="font-semibold mb-2">Technical Details</h4>
                            <div id="technicalInfo" class="text-sm space-y-2">
                                <!-- Technical info will be populated here -->
                            </div>
                        </div>
                    </div>
                    <div>
                        <h4 class="font-semibold mb-2">Chat Messages</h4>
                        <div id="chatMessages" class="session-details border rounded-lg p-4 bg-gray-50">
                            <!-- Chat messages will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TirupatiAdminPanel {
            constructor() {
                this.sessions = [];
                this.filteredSessions = [];
                this.init();
            }

            init() {
                this.loadSessions();
                this.bindEvents();
                this.updateStats();
                this.renderTable();
            }

            bindEvents() {
                document.getElementById('refreshBtn').addEventListener('click', () => {
                    this.loadSessions();
                    this.updateStats();
                    this.renderTable();
                });

                document.getElementById('exportBtn').addEventListener('click', () => {
                    this.exportToCSV();
                });

                document.getElementById('clearBtn').addEventListener('click', () => {
                    if (confirm('Are you sure you want to clear all session data? This action cannot be undone.')) {
                        this.clearAllData();
                    }
                });

                document.getElementById('filterBtn').addEventListener('click', () => {
                    this.applyFilters();
                });

                document.getElementById('closeModal').addEventListener('click', () => {
                    this.closeModal();
                });

                document.getElementById('sessionModal').addEventListener('click', (e) => {
                    if (e.target.id === 'sessionModal') {
                        this.closeModal();
                    }
                });
            }

            loadSessions() {
                const sessionsData = localStorage.getItem('tirupati_chat_sessions');
                this.sessions = sessionsData ? JSON.parse(sessionsData) : [];
                this.filteredSessions = [...this.sessions];
            }

            updateStats() {
                const totalSessions = this.filteredSessions.length;
                const uniqueEmails = new Set(this.filteredSessions.map(s => s.email)).size;
                const totalMessages = this.filteredSessions.reduce((sum, s) => sum + (s.messages ? s.messages.length : 0), 0);
                
                const avgDuration = this.filteredSessions.length > 0 
                    ? this.filteredSessions.reduce((sum, s) => {
                        const duration = new Date(s.endTime) - new Date(s.startTime);
                        return sum + duration;
                    }, 0) / this.filteredSessions.length / 60000 // Convert to minutes
                    : 0;

                document.getElementById('totalSessions').textContent = totalSessions;
                document.getElementById('uniqueVisitors').textContent = uniqueEmails;
                document.getElementById('totalMessages').textContent = totalMessages;
                document.getElementById('avgSessionTime').textContent = Math.round(avgDuration) + 'm';
            }

            renderTable() {
                const tbody = document.getElementById('sessionsTableBody');
                tbody.innerHTML = '';

                this.filteredSessions.forEach(session => {
                    const row = this.createTableRow(session);
                    tbody.appendChild(row);
                });
            }

            createTableRow(session) {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';

                const startTime = new Date(session.startTime).toLocaleString();
                const duration = session.endTime 
                    ? Math.round((new Date(session.endTime) - new Date(session.startTime)) / 60000) + 'm'
                    : 'Active';
                const messageCount = session.messages ? session.messages.length : 0;

                row.innerHTML = `
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${session.sessionId.substring(0, 12)}...
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${session.email}
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${session.contact}
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${startTime}
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${duration}
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${messageCount}
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-900">
                        <button onclick="adminPanel.viewSession('${session.sessionId}')" 
                                class="text-blue-600 hover:text-blue-900 mr-3">View</button>
                        <button onclick="adminPanel.deleteSession('${session.sessionId}')" 
                                class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                `;

                return row;
            }

            viewSession(sessionId) {
                const session = this.sessions.find(s => s.sessionId === sessionId);
                if (!session) return;

                document.getElementById('modalTitle').textContent = `Session: ${sessionId.substring(0, 12)}...`;
                
                const sessionInfo = document.getElementById('sessionInfo');
                sessionInfo.innerHTML = `
                    <p><strong>Email:</strong> ${session.email}</p>
                    <p><strong>Contact:</strong> ${session.contact}</p>
                    <p><strong>Start Time:</strong> ${new Date(session.startTime).toLocaleString()}</p>
                    <p><strong>End Time:</strong> ${session.endTime ? new Date(session.endTime).toLocaleString() : 'Active'}</p>
                    <p><strong>Duration:</strong> ${session.endTime ? Math.round((new Date(session.endTime) - new Date(session.startTime)) / 60000) + ' minutes' : 'Active'}</p>
                `;

                const technicalInfo = document.getElementById('technicalInfo');
                technicalInfo.innerHTML = `
                    <p><strong>User Agent:</strong> ${session.userAgent || 'N/A'}</p>
                    <p><strong>Referrer:</strong> ${session.referrer || 'Direct'}</p>
                    <p><strong>Page:</strong> ${session.page || 'N/A'}</p>
                    <p><strong>Session ID:</strong> ${session.sessionId}</p>
                `;

                const chatMessages = document.getElementById('chatMessages');
                if (session.messages && session.messages.length > 0) {
                    chatMessages.innerHTML = session.messages.map(msg => `
                        <div class="mb-3 p-3 rounded-lg ${msg.type === 'user' ? 'bg-blue-100 ml-8' : 'bg-gray-100 mr-8'}">
                            <div class="flex justify-between items-start mb-1">
                                <strong class="${msg.type === 'user' ? 'text-blue-700' : 'text-gray-700'}">
                                    ${msg.type === 'user' ? 'User' : 'Bot'}
                                </strong>
                                <span class="text-xs text-gray-500">
                                    ${new Date(msg.timestamp).toLocaleString()}
                                </span>
                            </div>
                            <p class="text-sm">${msg.message}</p>
                            ${msg.source ? `<p class="text-xs text-gray-500 mt-1">Source: ${msg.source}</p>` : ''}
                        </div>
                    `).join('');
                } else {
                    chatMessages.innerHTML = '<p class="text-gray-500">No messages in this session</p>';
                }

                document.getElementById('sessionModal').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('sessionModal').classList.add('hidden');
            }

            deleteSession(sessionId) {
                if (confirm('Are you sure you want to delete this session?')) {
                    this.sessions = this.sessions.filter(s => s.sessionId !== sessionId);
                    localStorage.setItem('tirupati_chat_sessions', JSON.stringify(this.sessions));
                    this.filteredSessions = this.filteredSessions.filter(s => s.sessionId !== sessionId);
                    this.updateStats();
                    this.renderTable();
                }
            }

            applyFilters() {
                const dateFrom = document.getElementById('dateFrom').value;
                const dateTo = document.getElementById('dateTo').value;
                const searchEmail = document.getElementById('searchEmail').value.toLowerCase();

                this.filteredSessions = this.sessions.filter(session => {
                    const sessionDate = new Date(session.startTime).toISOString().split('T')[0];
                    
                    if (dateFrom && sessionDate < dateFrom) return false;
                    if (dateTo && sessionDate > dateTo) return false;
                    if (searchEmail && !session.email.toLowerCase().includes(searchEmail)) return false;
                    
                    return true;
                });

                this.updateStats();
                this.renderTable();
            }

            exportToCSV() {
                const headers = ['Session ID', 'Email', 'Contact', 'Start Time', 'End Time', 'Duration (minutes)', 'Messages Count', 'User Agent', 'Referrer', 'Page'];
                
                const csvContent = [
                    headers.join(','),
                    ...this.filteredSessions.map(session => [
                        session.sessionId,
                        session.email,
                        session.contact,
                        session.startTime,
                        session.endTime || '',
                        session.endTime ? Math.round((new Date(session.endTime) - new Date(session.startTime)) / 60000) : '',
                        session.messages ? session.messages.length : 0,
                        `"${session.userAgent || ''}"`,
                        session.referrer || '',
                        session.page || ''
                    ].join(','))
                ].join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `tirupati-chat-sessions-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }

            clearAllData() {
                localStorage.removeItem('tirupati_chat_sessions');
                this.sessions = [];
                this.filteredSessions = [];
                this.updateStats();
                this.renderTable();
            }
        }

        // Initialize admin panel
        const adminPanel = new TirupatiAdminPanel();

        // Set default date range (last 30 days)
        const today = new Date();
        const thirtyDaysAgo = new Date(today.getTime() - (30 * 24 * 60 * 60 * 1000));
        
        document.getElementById('dateTo').value = today.toISOString().split('T')[0];
        document.getElementById('dateFrom').value = thirtyDaysAgo.toISOString().split('T')[0];
    </script>
</body>
</html>
